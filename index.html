<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Count To 1 Million</title>

  <style>
    h1 {
      text-align: center; 
      font-family: Arial, Helvetica, sans-serif; 
      font-size: 50px;
      z-index: 1;
    }

    .countdown {
      font-size: 100px;
      z-index: 1;
    }

    .time {
      text-align: center;
      font-size: xx-large;
      white-space: pre;
      z-index: 1;
    }

    img {
      max-width: 100%; /* Image will not exceed the width of its parent container */
      height: auto;    /* Height will adjust proportionally to maintain aspect ratio */
      
    }

    .buttons {
      text-align: center;
    }

    button {
      font-size: large;
      padding: 5px 12px;
    }
  </style>
</head>
<body>
  <div class="count-to-one-million">
    <h1>Count to e + 1</h1>
    <h1 class="count">0</h1>
    <br>
    <div class="time"></div>
  </div>
  <br>
  <div class="buttons">
    <button class="start-button">Start</button>
    <button class="reset-button">Reset</button>
  </div>
  
  <script>
    let dateTime = JSON.parse(localStorage.getItem('dateTime'));
    let stopValue = JSON.parse(localStorage.getItem('stopValue')); 
    let isRunning = JSON.parse(localStorage.getItem('isRunning'));
    let intervalId;

    if (isRunning) {
      runCounter(true, 100000, 'count-to-one-million', dateTime);
    }

    function calculateCount(countingUp, dateTime, startValue = 0, stopValue) {
      let currentTime = Date.now();
      let secondsElapsedSinceStartTime = Math.round((currentTime - dateTime) / 1000);

      // if (secondsElapsedSinceStartTime > stopValue) {
      //   secondsElapsedSinceStartTime = stopValue;
      // }
      
      if (countingUp) {
        return secondsElapsedSinceStartTime;
      } else {
        return startValue - secondsElapsedSinceStartTime;
      }
    }

    function updateCounter() {
      const stopValue = JSON.parse(localStorage.getItem('stopValue'));
      count = calculateCount(true, dateTime, stopValue)
      document.querySelector('.count').innerHTML = count.toLocaleString();
    }

    window.addEventListener('focus', function() {
      if (isRunning) {
        updateCounter();
      }
      console.log('window is in focus');
    });

    // '2025-08-15T18:00:00'
    function runCounter(countingUp, stopValue, containerClass, startDateTime) {
      if (startDateTime === 'now') {
        dateTime = Date.now();
      } else {
        dateTime = startDateTime;
      }
      
      localStorage.setItem('dateTime', JSON.stringify(dateTime));
      count = calculateCount(true, dateTime, stopValue);
      let countToDisplay= convertToScientificNotationIfNeeded(count);

      const counterHTML = document.querySelector(`.${containerClass}`).innerHTML = 
      `
        <h1>Count to e + 1</h1>
        <h1 class="count">${countToDisplay}</h1>
        <br>
        <div class="time"></div>
      `;

      intervalId = setInterval(() => {

        if (countingUp === true) {    
          if (count !== stopValue) {
            count++;
          } else {
            count--;
          }
        }
        
        document.querySelector(`.count`).innerHTML = convertToScientificNotationIfNeeded(count);

        let days = Math.floor(((count / 60) / 60) / 24) % 365;
        let hours = Math.floor((count / 60) / 60) % 24;
        let minutes = Math.floor(count / 60) % 60;
        let seconds = count % 60;

        document.querySelector('.time').innerHTML = `Days: ${days}    Hours: ${hours}    Minutes: ${minutes}    Seconds: ${seconds}`;
        
        if (count >= stopValue) {
          clearInterval(intervalId);
          console.log("Interval stopped.");
          localStorage.setItem('isRunning', JSON.stringify(false));
          document.querySelector('.time').innerHTML += `\n\nYay Benjamin!\n<img src="fireworks.jpg">`;
        }
      }, 10);
    }

    function convertToScientificNotationIfNeeded(count) {
      if (count <= 1000) {
        return count.toLocaleString();
      } else {
        let countString = String(count);
        let e = countString.length - 1;
        let firstDigit = countString.slice(0, 1);
        let otherDigits = countString.slice(1);
        return firstDigit + '.' + otherDigits + 'e' + String(e);
      }
    }

    const startButton = document.querySelector('.start-button');
    const resetButton = document.querySelector('.reset-button');

    startButton.addEventListener('click', () => {
      if (!isRunning) {
        runCounter(true, 1000000, 'count-to-one-million', 'now');
        localStorage.setItem('stopValue', JSON.stringify(1000000));
        localStorage.setItem('isRunning', JSON.stringify(true));
        isRunning = true;
      }
    });

    resetButton.addEventListener('click', () => {
      clearInterval(intervalId);
      document.querySelector('.count').innerHTML = 0;
      document.querySelector('.time').innerHTML = `Days: ${0}    Hours: ${0}    Minutes: ${0}    Seconds: ${0}`;
      localStorage.removeItem('dateTime');
      localStorage.removeItem('stopValue');
      localStorage.setItem('isRunning', JSON.stringify(false));
      isRunning = false;
    });
  </script>
</body>
</html>
